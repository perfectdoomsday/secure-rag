services:
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: ["qdrant_data:/qdrant/storage"]
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
    ports: ["8000:8000"]
    depends_on: [qdrant]
  ui:
    build: .
    command: streamlit run app/ui.py --server.address 0.0.0.0 --server.port 8501
    env_file: .env
    environment:
      RAG_API_URL: http://api:8000
    ports: ["8501:8501"]
    depends_on: [api]
  prometheus:
    image: prom/prometheus:latest
    ports: ["9090:9090"]
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    depends_on: [api]
volumes:
  qdrant_data:
