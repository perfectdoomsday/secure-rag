[project]
name = "secure-rag"
version = "1.0.0"
description = "Secure Retrieval-Augmented Generation application"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "UP"
]

ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.bandit]
exclude_dirs = ["tests", "evals", ".venv"]
skips = []

[tool.coverage.run]
branch = true
source = ["app"]
omit = [
    "tests/*",
    "evals/*",
    ".venv/*"
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 70

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_return_any = true
warn_unused_configs = true
